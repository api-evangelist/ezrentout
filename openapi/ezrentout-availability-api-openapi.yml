openapi: 3.2.0
info:
  title: EZRentOut Availability API
  description: REST API for EZRentOut, the cloud equipment rental management platform from EZO (the company behind EZOfficeInventory).
  version: '1.0'
  contact:
    name: EZO / EZRentOut Support
    url: https://ezo.io/ezrentout/developers/
    email: support@ezo.io
  termsOfService: https://ezo.io/ezrentout/terms-of-service/
servers:
- url: https://{subdomain}.ezrentout.com
  description: Customer rental account (tenant)
  variables:
    subdomain:
      default: your-company
      description: Your EZRentOut company subdomain.
security:
- tokenAuth: []
tags:
- name: Availability
  description: Booked dates and per-location quantity for scheduling.
paths:
  /locations/get_quantity_by_location.api:
    get:
      operationId: getQuantityByLocation
      tags:
      - Availability
      summary: Get item quantity by location
      description: Returns available quantity of items broken down by location.
      parameters:
      - name: asset_id
        in: query
        schema:
          type: integer
      responses:
        '200':
          description: Quantity by location.
          content:
            application/json:
              schema:
                type: object
  /assets/{assetNum}/booked_dates.api:
    get:
      operationId: getAssetBookedDates
      tags:
      - Availability
      summary: Get booked dates for an asset
      description: Returns the reserved (booked) date ranges for an asset so integrations can avoid double-booking.
      parameters:
      - $ref: '#/components/parameters/AssetNum'
      responses:
        '200':
          description: Booked date ranges.
          content:
            application/json:
              schema:
                type: object
                properties:
                  booked_dates:
                    type: array
                    items:
                      $ref: '#/components/schemas/BookedDate'
  /inventory/{assetNum}/booked_dates.api:
    get:
      operationId: getInventoryBookedDates
      tags:
      - Availability
      summary: Get booked dates for an inventory item
      parameters:
      - $ref: '#/components/parameters/AssetNum'
      responses:
        '200':
          description: Booked date ranges.
          content:
            application/json:
              schema:
                type: object
components:
  parameters:
    AssetNum:
      name: assetNum
      in: path
      required: true
      description: The asset / inventory item number.
      schema:
        type: integer
  schemas:
    BookedDate:
      type: object
      properties:
        starts_on:
          type: string
        ends_on:
          type: string
        order_number:
          type: integer
  securitySchemes:
    tokenAuth:
      type: apiKey
      in: header
      name: token
      description: Per-company access token generated in Settings (API must be enabled by the account owner). Sent in the `token` HTTP header on every request over HTTPS.

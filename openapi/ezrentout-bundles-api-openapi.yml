openapi: 3.2.0
info:
  title: EZRentOut Bundles API
  description: REST API for EZRentOut, the cloud equipment rental management platform from EZO (the company behind EZOfficeInventory).
  version: '1.0'
  contact:
    name: EZO / EZRentOut Support
    url: https://ezo.io/ezrentout/developers/
    email: support@ezo.io
  termsOfService: https://ezo.io/ezrentout/terms-of-service/
servers:
- url: https://{subdomain}.ezrentout.com
  description: Customer rental account (tenant)
  variables:
    subdomain:
      default: your-company
      description: Your EZRentOut company subdomain.
security:
- tokenAuth: []
tags:
- name: Bundles
  description: Reusable kits of assets and inventory rented together.
paths:
  /bundles.api:
    get:
      operationId: listBundles
      tags:
      - Bundles
      summary: List bundles
      parameters:
      - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: A page of bundles.
          content:
            application/json:
              schema:
                type: object
                properties:
                  bundles:
                    type: array
                    items:
                      $ref: '#/components/schemas/Bundle'
    post:
      operationId: createBundle
      tags:
      - Bundles
      summary: Create a bundle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Bundle'
      responses:
        '201':
          description: The created bundle.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bundle'
  /bundles/{bundleId}.api:
    get:
      operationId: getBundle
      tags:
      - Bundles
      summary: Get bundle details
      parameters:
      - name: bundleId
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: The bundle.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bundle'
components:
  schemas:
    Bundle:
      type: object
      description: A reusable kit of assets and inventory.
      properties:
        id:
          type: integer
        name:
          type: string
        line_items:
          type: array
          items:
            type: object
  parameters:
    Page:
      name: page
      in: query
      description: Page number for paginated list results (default 1).
      schema:
        type: integer
        default: 1
  securitySchemes:
    tokenAuth:
      type: apiKey
      in: header
      name: token
      description: Per-company access token generated in Settings (API must be enabled by the account owner). Sent in the `token` HTTP header on every request over HTTPS.
